name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            profilePath: Assets/Settings/Build Profiles/Windows.asset
          - name: WindowsServer
            profilePath: Assets/Settings/Build Profiles/Windows Server.asset
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.name }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.name }}-
            Library-

      - name: Cache LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            lfs-

      - name: Discard changes
        run: |
          git checkout -- .
          git clean -fd

      - name: Build project
        uses: game-ci/unity-builder@v4
        with:
          buildProfile: ${{ matrix.profilePath }}
          buildName: ${{ matrix.name }}

      - name: Create Single EXE (SFX)
        run: |
          chmod +x Scripts/create_sfx.sh
          ./Scripts/create_sfx.sh build "${{ matrix.name }}.exe" "${{ matrix.name }}_Single.exe"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: ${{ matrix.name == 'Windows' }}
          files: ${{ matrix.name }}_Single.exe

name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            profilePath: Assets/Settings/Build Profiles/Windows.asset
          - name: WindowsServer
            profilePath: Assets/Settings/Build Profiles/Windows Server.asset
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.name }}
          restore-keys: |
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        with:
          buildProfile: ${{ matrix.profilePath }}
          unityVersion: 6000.2.15f1
          buildName: ${{ matrix.name }}

      - name: Zip Build
        run: |
          cd build
          zip -r ../${{ matrix.name }}.zip .

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}.zip
